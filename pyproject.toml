[project]
name = "av-capstone-project"
version = "0.1.0"
description = "Drug-conditioned sentiment analysis (Analytics Vidhya Blackbelt capstone)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.5",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "vadersentiment>=3.3.2",
    "wordcloud>=1.9.6",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "drug_sentiment"

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]
