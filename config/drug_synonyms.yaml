# Names that refer to the same drug product: brand, generic (INN), development code and spelling
# variants that occur in train.csv's `drug` column.
#
# Written from domain knowledge for the drugs in train.csv only (test.csv was not used).
# A mention of any member counts as a mention of the row's drug, and the "other drugs" count treats a
# group as one drug. Biosimilars (e.g. Amjevita, Inflectra, Renflexis) stay separate from the
# originator: patients can report different experiences with them.

